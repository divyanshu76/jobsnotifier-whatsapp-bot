services:
  jobsnotifier:
    build: .
    image: jobsnotifier:local
    container_name: jobsnotifier
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      TZ: Asia/Kolkata
    volumes:
      - ./auth:/app/auth
      - ./data:/app/data
      - ./logs:/app/logs
    stop_grace_period: 30s
